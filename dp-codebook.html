<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DP Codebook — Deceptive Game Design Patterns</title>
<style>
/* ============ tokens ============ */
:root{
  --paper:#f7f7f4;        /* cool near-white */
  --card:#fffffe;
  --ink:#26251f;          /* graphite */
  --muted:#6d6b60;
  --line:#dddcd4;
  --pine:#1e4b42;         /* structure, links, group titles */
  --pine-soft:#e7eeec;
  --stamp:#9c3b23;        /* reserved: verbatim seal + dirty dot */
  --stamp-soft:#f6e9e4;
  --amber:#8a6a1c;
  --amber-soft:#f4edda;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L","Iowan Old Style",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.55}

/* ============ toolbar ============ */
#toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;
  padding:.6rem 1.1rem;background:var(--paper);border-bottom:2px solid var(--ink)}
.brand{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.01em;display:flex;align-items:center;gap:.55rem}
.brand small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
#versionBadge{font-family:var(--mono);font-size:.75rem;color:var(--pine);border:1.5px solid var(--pine);
  border-radius:2px;padding:.1rem .45rem;transform:rotate(-1.5deg);background:var(--pine-soft)}
#dirtyDot{width:.6rem;height:.6rem;border-radius:50%;background:var(--stamp);display:none}
#dirtyDot.on{display:inline-block}
.actions{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.tb-btn{font-family:var(--sans);font-size:.78rem;padding:.35rem .7rem;border:1px solid var(--ink);
  background:var(--card);color:var(--ink);cursor:pointer;border-radius:2px}
.tb-btn:hover{background:var(--pine);border-color:var(--pine);color:#fff}
.tb-btn.primary{background:var(--ink);color:#fff}
.tb-btn.primary:hover{background:var(--pine)}

/* ============ layout ============ */
#layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1180px;margin:0 auto}
#sidebar{border-right:1px solid var(--line);padding:1rem .9rem 3rem;
  position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;font-family:var(--sans)}
#search{width:100%;font-family:var(--sans);font-size:.82rem;padding:.45rem .6rem;
  border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink)}
#search:focus{outline:2px solid var(--pine);outline-offset:1px}
.side-tabs{display:flex;gap:.3rem;margin:.7rem 0 .5rem}
.side-tab{flex:1;font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.3rem;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);border-radius:2px}
.side-tab.on{border-color:var(--pine);color:var(--pine);background:var(--pine-soft);font-weight:600}
#toc a,.gap-item{display:block;text-decoration:none;color:var(--ink);font-size:.8rem;
  padding:.18rem .35rem;border-left:2px solid transparent}
#toc a:hover,.gap-item:hover{border-left-color:var(--pine);color:var(--pine)}
#toc a.toc-group{font-weight:700;margin-top:.55rem;color:var(--pine);text-transform:uppercase;font-size:.7rem;letter-spacing:.08em}
#toc a.toc-low{padding-left:1.1rem;color:var(--muted)}
#toc a.hide{display:none}
.gap-item{margin:.3rem 0;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:2px;padding:.35rem .5rem}
.gap-name{font-weight:600;font-size:.8rem}
.gap-miss{font-size:.7rem;color:var(--amber)}

/* ============ document ============ */
#doc{padding:1.6rem 2.2rem 6rem;max-width:820px}
.group{margin-bottom:2.6rem}
.group.dim{opacity:.35}
.group-title{font-size:1.7rem;margin:1.6rem 0 .4rem;color:var(--pine);
  border-bottom:2px solid var(--pine);padding-bottom:.2rem;letter-spacing:.01em}
.group-note{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin:.2rem 0 1rem}
.class-def{margin:.4rem 0 1.2rem;padding:.2rem 0 .2rem 1rem;border-left:3px solid var(--pine)}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:1rem 1.2rem;margin:.9rem 0;break-inside:avoid}
.card.low{margin-left:1.6rem;border-left:3px solid var(--pine)}
.card.hide,.rule-card.hide{display:none}
.card-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem}
.card-title{margin:0;font-size:1.15rem}
.badge{font-family:var(--sans);font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;
  padding:.12rem .45rem;border-radius:2px;white-space:nowrap}
.low-badge{background:var(--pine-soft);color:var(--pine);border:1px solid var(--pine)}
.gap-badge{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.mono{font-family:var(--mono);font-size:.85em}

.field{margin:.65rem 0}
.field-label{font-family:var(--sans);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.15rem}
.mini-label{font-family:var(--sans);font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:.05rem}

/* editable */
.editable{cursor:text;border-radius:2px;padding:.1rem .25rem;margin:-.1rem -.25rem;min-height:1.2em}
.editable:hover{background:var(--pine-soft);outline:1px dashed var(--pine)}
.editable.empty .ed-text{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:.85em}
.editable textarea,.editable input{width:100%;font:inherit;color:inherit;background:#fffdf5;
  border:1.5px solid var(--pine);border-radius:2px;padding:.3rem .4rem}
.editable textarea:focus,.editable input:focus{outline:none;box-shadow:0 0 0 2px var(--pine-soft)}
.cite .ed-text{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.title-ed{font-weight:700}

/* signature: verbatim seal */
.editable.canonical.empty{border:1.5px dashed var(--amber);background:var(--amber-soft);
  padding:.45rem .7rem;margin-left:0;border-left-width:1.5px}
.editable.canonical.empty .ed-text{color:var(--amber)}

.canonical{border-left:3px solid var(--stamp);padding-left:.8rem;margin-left:0;background:transparent}
.canonical:hover{background:var(--stamp-soft);outline:1px dashed var(--stamp)}
.seal{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  color:var(--stamp);border:1px solid var(--stamp);border-radius:2px;padding:.05rem .4rem;
  margin-bottom:.25rem;transform:rotate(-1deg);background:var(--stamp-soft);user-select:none}
.canonical .ed-text{font-style:italic}

/* arrays */
.arr-row{display:flex;gap:.5rem;align-items:flex-start;padding:.28rem 0;border-bottom:1px dotted var(--line)}
.arr-body{flex:1;min-width:0}
.ctl{display:flex;gap:.15rem;flex-shrink:0}
.ctl-btn{font-family:var(--sans);font-size:.68rem;width:1.45rem;height:1.45rem;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer;border-radius:2px;line-height:1}
.ctl-btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.ctl-btn:disabled{opacity:.3;cursor:default}
.add-btn{font-family:var(--sans);font-size:.72rem;margin-top:.4rem;padding:.25rem .6rem;
  border:1px dashed var(--pine);background:transparent;color:var(--pine);cursor:pointer;border-radius:2px}
.add-btn:hover{background:var(--pine-soft)}
.add-label{display:block;margin:.6rem 0 0}
.pair{display:grid;grid-template-columns:170px minmax(0,1fr);gap:.6rem;margin:.2rem 0}
.pair-a,.pair-b{min-width:0}

/* rules & changelog */
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:.8rem 1rem;break-inside:avoid}
.rule-id{font-weight:700;color:var(--pine);font-size:.95rem}
.log-row{padding:.3rem 0}
.log-meta{display:flex;align-items:center;gap:.7rem;font-family:var(--sans);font-size:.8rem;margin-bottom:.2rem}
.log-meta .badge{background:var(--pine-soft);color:var(--pine);border:1px solid var(--pine)}
.inv-label{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.3rem}

/* dialogs */
dialog{border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);
  font-family:var(--sans);max-width:620px;width:92vw;padding:1.2rem 1.4rem}
dialog::backdrop{background:rgba(38,37,31,.45)}
dialog h3{margin:0 0 .7rem;font-family:var(--serif)}
dialog label{display:block;font-size:.78rem;margin:.6rem 0 .2rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}
dialog textarea,dialog input[type=text]{width:100%;font-family:var(--sans);font-size:.85rem;
  padding:.4rem .5rem;border:1px solid var(--line);border-radius:2px}
.dlg-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
#mergeDialog{max-width:780px}
#mergeList{max-height:55vh;overflow-y:auto;margin-top:.6rem}
.diff-row{border:1px solid var(--line);border-radius:2px;padding:.55rem .7rem;margin:.45rem 0}
.diff-path{font-size:.72rem;color:var(--pine);margin-bottom:.3rem}
.diff-cmp{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;font-size:.78rem}
.diff-side{min-width:0;overflow-wrap:break-word}
.take-all{border-style:solid;font-weight:600}

@media (max-width:840px){
  #layout{grid-template-columns:1fr}
  #sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  #doc{padding:1rem 1.1rem 4rem}
  .pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ============ print ============ */
@media print{
  #toolbar,#sidebar,.ctl,.add-btn,.tb-btn,dialog{display:none !important}
  #layout{display:block;max-width:none}
  #doc{max-width:none;padding:0}
  body{background:#fff;color:#000;font-size:11pt}
  .card,.rule-card{border:1px solid #999;box-shadow:none;page-break-inside:avoid}
  .card.hide,.rule-card.hide{display:block !important}   /* print the whole book */
  .group.dim{opacity:1}
  .group-title{page-break-after:avoid}
  .editable:hover{background:transparent;outline:none}
  .seal{color:#000;border-color:#000;background:transparent}
  .canonical{border-left-color:#000}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>

<header id="toolbar">
  <div class="brand">DP&nbsp;Codebook <small>Deceptive Game Design Patterns</small>
    <span id="versionBadge">v–</span><span id="dirtyDot" title="Unsaved changes"></span>
  </div>
  <div class="actions">
    <button class="tb-btn" id="btnLoad" title="Replace the codebook with a JSON file">Load JSON</button>
    <button class="tb-btn" id="btnMerge" title="Diff a second JSON against the current codebook">Import / Merge</button>
    <button class="tb-btn" id="btnBump" title="Record a change and increment the version">Bump version</button>
    <button class="tb-btn" id="btnPrint" title="Print or export to PDF">Print / PDF</button>
    <button class="tb-btn primary" id="btnSave" title="Download codebook_v{version}.json">Save JSON</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <input id="search" type="search" placeholder="Search the codebook…" aria-label="Search codebook">
    <div class="side-tabs">
      <button class="side-tab on" data-tab="toc" type="button">Contents</button>
      <button class="side-tab" data-tab="gaps" type="button">Gaps</button>
    </div>
    <nav id="toc" aria-label="Table of contents"></nav>
    <div id="gaps" hidden></div>
  </aside>
  <main id="doc"></main>
</div>

<dialog id="bumpDialog">
  <h3>Bump version</h3>
  <label for="bumpDesc">What changed</label>
  <textarea id="bumpDesc" rows="3" placeholder="e.g. Tightened the FOMO vs. Evil Battle Pass boundary rule after pilot disagreement on rows 112–140"></textarea>
  <label class="inv-label" style="text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:.4rem">
    <input type="checkbox" id="bumpInvalid"> This change invalidates prior coding
  </label>
  <label for="bumpRows">Rows re-checked (optional)</label>
  <input type="text" id="bumpRows" placeholder="e.g. 1–250, or ‘none yet’">
  <div class="dlg-actions">
    <button class="tb-btn" id="bumpCancel" type="button">Cancel</button>
    <button class="tb-btn primary" id="bumpGo" type="button">Record &amp; bump</button>
  </div>
</dialog>

<dialog id="mergeDialog">
  <h3>Import / merge</h3>
  <p id="mergeSummary" style="font-size:.85rem;color:var(--muted);margin:.2rem 0"></p>
  <div id="mergeList"></div>
  <div class="dlg-actions">
    <button class="tb-btn" id="mergeClose" type="button">Done</button>
  </div>
</dialog>

<input type="file" id="loadFile" accept=".json,application/json" hidden>
<input type="file" id="mergeFile" accept=".json,application/json" hidden>

      ev.stopPropagation();
      if (opts.locked && String(target[key] == null ? '' : target[key]).trim() && !window.confirm(VERBATIM_CONFIRM)) return;
      startEdit();

      box.focus();

      row.appendChild(body);

      var ctl = el('div', 'ctl');
      addBtn('\u2191', 'move up', i === 0, function () {
        var t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; done();
      });
      addBtn('\u2193', 'move down', i === arr.length - 1, function () {
        var t = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t; done();
      });
      addBtn('\u2715', 'remove', false, function () { arr.splice(i, 1); done(); });
      function addBtn(sym, tip, dis, fn) {
        var b = el('button', 'ctl-btn', sym);
        b.type = 'button'; b.title = tip; b.disabled = dis;
        b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
        ctl.appendChild(b);
      }
      row.appendChild(ctl);
      box.appendChild(row);
    });
    var add = el('button', 'add-btn', '\uFF0B ' + (cfg.addLabel || 'Add item'));
    add.type = 'button';
    add.addEventListener('click', function () { arr.push(cfg.blank()); done(); });
    box.appendChild(add);
    function done() { markDirty(); renderAll(); }
    return box;
  }

  function pairRow(labelA, nodeA, labelB, nodeB) {
    var w = el('div', 'pair');
    var a = el('div', 'pair-a'); a.appendChild(el('span', 'mini-label', labelA)); a.appendChild(nodeA);
    var b = el('div', 'pair-b'); b.appendChild(el('span', 'mini-label', labelB)); b.appendChild(nodeB);
    w.appendChild(a); w.appendChild(b);
    return w;
  }

  /* ---------- gaps ---------- */
  function gapsFor(lb) {
    var g = [];
    if (!lb.canonical_definition || lb.definition_pending) g.push('definition');
    if (!lb.indicators || !lb.indicators.length) g.push('indicators');
    if (!lb.boundary_rules || !lb.boundary_rules.length) g.push('boundary rules');
    if (!lb.worked_examples || !lb.worked_examples.length) g.push('worked examples');
    return g;
  }

  /* ---------- cards ---------- */
  function labelCard(lb) {
    var card = el('article', 'card' + (lb.level === 'low' ? ' low' : ''));
    card.id = cardId(lb);

    var head = el('header', 'card-head');
    var h = el('h3', 'card-title');
    h.appendChild(editable(lb, 'meso_label', { multiline: false, block: false, className: 'title-ed' }));
    head.appendChild(h);
    if (lb.level === 'low') {
      head.appendChild(el('span', 'badge low-badge', 'low-level \u00b7 under ' + (lb.parent_meso || '?')));
    }
    var gg = gapsFor(lb);
    if (gg.length) {
      var chip = el('span', 'badge gap-badge', '\u26A0 ' + gg.length + ' gap' + (gg.length > 1 ? 's' : ''));
      chip.title = 'Missing: ' + gg.join(', ');
      head.appendChild(chip);
    }
    card.appendChild(head);

    card.appendChild(field('Canonical definition',
      editable(lb, 'canonical_definition', {
        locked: true,
        placeholder: '\u2014 FILL: write the definition here (see citation for guidance) \u2014',
        className: 'canonical'
      })));
    card.appendChild(field('Citation',
      editable(lb, 'definition_citation', { multiline: false, className: 'cite' })));

    card.appendChild(field('Indicators & low-level patterns', listEditor(lb.indicators, {
      render: function (it, i) { return editable(lb.indicators, i, { placeholder: '\u2014 indicator \u2014' }); },
      blank: function () { return ''; },
      addLabel: 'Add indicator'
    })));

    card.appendChild(field('Boundary rules', listEditor(lb.boundary_rules, {
      render: function (br) {
        return pairRow('vs', editable(br, 'vs_label', { multiline: false }),
          'rule', editable(br, 'rule'));
      },
      blank: function () { return { vs_label: '', rule: '' }; },
      addLabel: 'Add boundary rule'
    })));

    card.appendChild(field('Counterexamples', listEditor(lb.counterexamples, {
      render: function (cx) {
        var w = el('div');
        w.appendChild(pairRow('review id', editable(cx, 'review_id', { multiline: false, className: 'mono' }),
          'text', editable(cx, 'text')));
        var why = el('div', 'pair-a');
        why.appendChild(el('span', 'mini-label', 'why not'));
        why.appendChild(editable(cx, 'why_not'));
        w.appendChild(why);
        return w;
      },
      blank: function () { return { review_id: '', text: '', why_not: '' }; },
      addLabel: 'Add counterexample'
    })));

    card.appendChild(field('Worked examples', listEditor(lb.worked_examples, {
      render: function (wx) {
        var w = el('div');
        w.appendChild(pairRow('review id', editable(wx, 'review_id', { multiline: false, className: 'mono' }),
          'text', editable(wx, 'text')));
        var la = el('div', 'pair-a');
        la.appendChild(el('span', 'mini-label', 'labels assigned'));
        la.appendChild(csvEditable(wx, 'labels_assigned'));
        w.appendChild(la);
        return w;
      },
      blank: function () { return { review_id: '', text: '', labels_assigned: [] }; },
      addLabel: 'Add worked example'
    })));

    return card;
  }

  function ruleCard(r) {
    var w = el('div', 'rule-card');
    w.id = 'rule-' + slugify(r.id || 'r');
    var head = el('div', 'rule-head');
    head.appendChild(editable(r, 'id', { multiline: false, block: false, className: 'rule-id mono' }));
    w.appendChild(head);
    w.appendChild(field('Statement', editable(r, 'statement')));
    w.appendChild(pairRow('worked example review id',
      editable(r, 'worked_example_review_id', { multiline: false, className: 'mono' }),
      'worked example text', editable(r, 'worked_example_text')));
    return w;
  }

  /* ---------- document ---------- */
  function groupOrder() {
    var order = (data.high_level_classes || []).map(function (c) { return c.name; });
    (data.labels || []).forEach(function (lb) {
      if (order.indexOf(lb.high_level) === -1) order.push(lb.high_level);
    });
    return order;
  }

  function renderDoc() {
    var doc = $('#doc');
    doc.textContent = '';

    /* Global rules — pinned first */
    var rulesSec = el('section', 'group rules-group');
    rulesSec.id = 'global-rules';
    rulesSec.appendChild(el('h2', 'group-title', 'Global Rules'));
    rulesSec.appendChild(listEditor(data.global_rules, {
      render: function (r) { return ruleCard(r); },
      blank: function () {
        return { id: 'R' + (data.global_rules.length + 1), statement: '', worked_example_review_id: '', worked_example_text: '' };
      },
      addLabel: 'Add rule'
    }));
    doc.appendChild(rulesSec);

    /* Groups */
    groupOrder().forEach(function (gname) {
      var sec = el('section', 'group');
      sec.id = 'group-' + slugify(gname);
      sec.appendChild(el('h2', 'group-title', gname));

      var cls = (data.high_level_classes || []).find(function (c) { return c.name === gname; });
      if (cls) {
        var cd = el('div', 'class-def');
        cd.appendChild(editable(cls, 'canonical_definition', { locked: true, className: 'canonical' }));
        cd.appendChild(editable(cls, 'definition_citation', { multiline: false, className: 'cite' }));
        sec.appendChild(cd);
      }

      data.labels.forEach(function (lb) {
        if (lb.high_level === gname) sec.appendChild(labelCard(lb));
      });

      var add = el('button', 'add-btn add-label', '\uFF0B Add label to ' + gname);
      add.type = 'button';
      add.addEventListener('click', function () {
        data.labels.push({
          high_level: gname, meso_label: 'New label', level: 'meso',
          canonical_definition: '', definition_citation: '', definition_pending: false,
          indicators: [], boundary_rules: [], counterexamples: [], worked_examples: []
        });
        markDirty(); renderAll();
      });
      sec.appendChild(add);
      doc.appendChild(sec);
    });

    /* Changelog — pinned last */
    var logSec = el('section', 'group changelog-group');
    logSec.id = 'changelog';
    logSec.appendChild(el('h2', 'group-title', 'Changelog'));
    logSec.appendChild(listEditor(data.changelog, {
      render: function (c) {
        var w = el('div', 'log-row');
        var meta = el('div', 'log-meta');
        meta.appendChild(el('span', 'badge mono', 'v' + c.version));
        meta.appendChild(editable(c, 'date', { multiline: false, block: false, className: 'mono' }));
        var inv = el('label', 'inv-label');
        var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!c.invalidates_prior_coding;
        cb.addEventListener('change', function () { c.invalidates_prior_coding = cb.checked; markDirty(); });
        inv.appendChild(cb);
        inv.appendChild(document.createTextNode(' invalidates prior coding'));
        meta.appendChild(inv);
        w.appendChild(meta);
        w.appendChild(editable(c, 'change'));
        w.appendChild(pairRow('rows re-checked',
          editable(c, 'rows_rechecked', { multiline: false, className: 'mono' }),
          '', el('span')));
        return w;
      },
      blank: function () {
        return { version: data.version, date: today(), change: '', invalidates_prior_coding: false, rows_rechecked: '' };
      },
      addLabel: 'Add entry'
    }));
    doc.appendChild(logSec);
  }

  /* ---------- sidebar ---------- */
  function renderTOC() {
    var toc = $('#toc');
    toc.textContent = '';
    toc.appendChild(tocLink('Global Rules', '#global-rules', 'toc-group'));
    groupOrder().forEach(function (g) {
      toc.appendChild(tocLink(g, '#group-' + slugify(g), 'toc-group'));
      data.labels.forEach(function (lb) {
        if (lb.high_level !== g) return;
        toc.appendChild(tocLink(lb.meso_label, '#' + cardId(lb),
          'toc-label' + (lb.level === 'low' ? ' toc-low' : '')));
      });
    });
    toc.appendChild(tocLink('Changelog', '#changelog', 'toc-group'));
  }
  function tocLink(txt, href, cls) {
    var a = el('a', cls, txt);
    a.href = href;
    return a;
  }

  function renderGaps() {
    var g = $('#gaps');
    g.textContent = '';
    var any = false;
    data.labels.forEach(function (lb) {
      var miss = gapsFor(lb);
      if (!miss.length) return;
      any = true;
      var a = el('a', 'gap-item');
      a.href = '#' + cardId(lb);
      a.appendChild(el('div', 'gap-name', lb.meso_label));
      a.appendChild(el('div', 'gap-miss', 'missing: ' + miss.join(', ')));
      g.appendChild(a);
    });
    if (!any) g.appendChild(el('p', 'group-note', 'No gaps \u2014 every label has a definition, indicators, boundary rules, and worked examples.'));
  }

  /* ---------- search ---------- */
  function applyFilter() {
    var q = query.trim().toLowerCase();
    document.querySelectorAll('#doc .card, #doc .rule-card').forEach(function (c) {
      c.classList.toggle('hide', !!q && c.textContent.toLowerCase().indexOf(q) === -1);
    });
    document.querySelectorAll('#doc .group').forEach(function (sec) {
      var cards = sec.querySelectorAll('.card, .rule-card');
      if (!cards.length) return;
      var allHidden = Array.prototype.every.call(cards, function (c) { return c.classList.contains('hide'); });
      sec.classList.toggle('dim', !!q && allHidden);
    });
    document.querySelectorAll('#toc a.toc-label').forEach(function (a) {
      a.classList.toggle('hide', !!q && a.textContent.toLowerCase().indexOf(q) === -1);
    });
  }

  function renderAll() {
    var y = window.scrollY;
    renderDoc();
    renderTOC();
    renderGaps();
    updateHeader();
    applyFilter();
    window.scrollTo(0, y);
  }

  /* ---------- version bump ---------- */
  function openBump() {
    $('#bumpDesc').value = '';
    $('#bumpInvalid').checked = false;
    $('#bumpRows').value = '';
    $('#bumpDialog').showModal();
  }
  function doBump() {
    var desc = $('#bumpDesc').value.trim();
    if (!desc) { alert('Describe the change first \u2014 the changelog is the audit trail.'); return; }
    var parts = String(data.version).split('.');
    var maj = parseInt(parts[0], 10) || 0;
    var min = parseInt(parts[1], 10) || 0;
    var nv = maj + '.' + (min + 1);
    data.changelog.push({
      version: nv, date: today(), change: desc,
      invalidates_prior_coding: $('#bumpInvalid').checked,
      rows_rechecked: $('#bumpRows').value.trim()
    });
    data.version = nv;
    markDirty();
    $('#bumpDialog').close();
    renderAll();
  }

  /* ---------- save / load ---------- */
  function saveJSON() {
    var out = clone(data);
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'codebook_v' + data.version + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
    dirty = false;
    updateHeader();
  }

  function readFile(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      try { cb(JSON.parse(r.result)); }
      catch (e) { alert('Could not parse JSON: ' + e.message); }
    };
    r.readAsText(file);
  }

  function loadJSON(parsed) {
    if (!parsed || !parsed.version || !Array.isArray(parsed.labels)) {
      alert('This file does not look like a codebook (needs version + labels).');
      return;
    }
    ['changelog', 'global_rules', 'high_level_classes', 'labels'].forEach(function (k) {
      if (!Array.isArray(parsed[k])) parsed[k] = [];
    });
    parsed.labels.forEach(function (lb) {
      ['indicators', 'boundary_rules', 'counterexamples', 'worked_examples'].forEach(function (k) {
        if (!Array.isArray(lb[k])) lb[k] = [];
      });
    });
    data = parsed;
    dirty = false;
    renderAll();
  }

  /* ---------- import / merge ---------- */
  var LABEL_FIELDS = ['canonical_definition', 'definition_citation', 'definition_pending',
    'indicators', 'boundary_rules', 'counterexamples', 'worked_examples', 'level', 'parent_meso'];
  var RULE_FIELDS = ['statement', 'worked_example_review_id', 'worked_example_text'];

  function buildDiff(incoming) {
    var diffs = [];
    function key(l) { return l.high_level + ' \u25b8 ' + l.meso_label; }

    if (incoming.version !== data.version) {
      diffs.push({
        path: 'version', cur: data.version, inc: incoming.version,
        apply: function () { data.version = incoming.version; }
      });
    }
    var curMap = {}, incMap = {};
    data.labels.forEach(function (l) { curMap[key(l)] = l; });
    (incoming.labels || []).forEach(function (l) { incMap[key(l)] = l; });

    Object.keys(incMap).forEach(function (k) {
      if (!curMap[k]) {
        diffs.push({
          path: 'label added: ' + k, cur: '(absent)', inc: preview(incMap[k].canonical_definition || incMap[k]),
          apply: function () { data.labels.push(clone(incMap[k])); }
        });
      } else {
        LABEL_FIELDS.forEach(function (f) {
          var a = JSON.stringify(curMap[k][f] === undefined ? null : curMap[k][f]);
          var b = JSON.stringify(incMap[k][f] === undefined ? null : incMap[k][f]);
          if (a !== b) {
            diffs.push({
              path: k + ' \u00b7 ' + f, cur: preview(curMap[k][f]), inc: preview(incMap[k][f]),
              apply: function () { curMap[k][f] = clone(incMap[k][f]); }
            });
          }
        });
      }
    });
    Object.keys(curMap).forEach(function (k) {
      if (!incMap[k]) {
        diffs.push({
          path: 'label only in current: ' + k, cur: preview(curMap[k].canonical_definition || curMap[k]), inc: '(absent in incoming)',
          apply: function () {
            var i = data.labels.indexOf(curMap[k]);
            if (i > -1) data.labels.splice(i, 1);
          },
          applyLabel: 'Delete from current'
        });
      }
    });

    var curR = {}, incR = {};
    (data.global_rules || []).forEach(function (r) { curR[r.id] = r; });
    (incoming.global_rules || []).forEach(function (r) { incR[r.id] = r; });
    Object.keys(incR).forEach(function (id) {
      if (!curR[id]) {
        diffs.push({
          path: 'rule added: ' + id, cur: '(absent)', inc: preview(incR[id].statement),
          apply: function () { data.global_rules.push(clone(incR[id])); }
        });
      } else {
        RULE_FIELDS.forEach(function (f) {
          if (JSON.stringify(curR[id][f] || '') !== JSON.stringify(incR[id][f] || '')) {
            diffs.push({
              path: id + ' \u00b7 ' + f, cur: preview(curR[id][f]), inc: preview(incR[id][f]),
              apply: function () { curR[id][f] = clone(incR[id][f]); }
            });
          }
        });
      }
    });

    var curVersions = (data.changelog || []).map(function (c) { return c.version + '|' + c.change; });
    (incoming.changelog || []).forEach(function (c) {
      if (curVersions.indexOf(c.version + '|' + c.change) === -1) {
        diffs.push({
          path: 'changelog entry v' + c.version, cur: '(absent)', inc: preview(c.change),
          apply: function () { data.changelog.push(clone(c)); }
        });
      }
    });
    return diffs;
  }

  function preview(v) {
    var s = typeof v === 'string' ? v : JSON.stringify(v);
    if (s == null) s = '(empty)';
    s = String(s);
    return s.length > 110 ? s.slice(0, 110) + '\u2026' : (s || '(empty)');
  }

  function openMerge(incoming) {
    var list = $('#mergeList');
    list.textContent = '';
    var diffs = buildDiff(incoming);
    $('#mergeSummary').textContent = diffs.length
      ? diffs.length + ' difference' + (diffs.length > 1 ? 's' : '') + ' between current and incoming.'
      : 'No differences \u2014 the two files match.';
    diffs.forEach(function (d) {
      var row = el('div', 'diff-row');
      row.appendChild(el('div', 'diff-path mono', d.path));
      var cmp = el('div', 'diff-cmp');
      var cur = el('div', 'diff-side'); cur.appendChild(el('span', 'mini-label', 'current')); cur.appendChild(el('div', null, d.cur));
      var inc = el('div', 'diff-side'); inc.appendChild(el('span', 'mini-label', 'incoming')); inc.appendChild(el('div', null, d.inc));
      cmp.appendChild(cur); cmp.appendChild(inc);
      row.appendChild(cmp);
      var b = el('button', 'add-btn', d.applyLabel || 'Take incoming');
      b.type = 'button';
      b.addEventListener('click', function () {
        d.apply(); markDirty(); row.remove(); renderAll();
      });
      row.appendChild(b);
      list.appendChild(row);
    });
    if (diffs.length) {
      var all = el('button', 'add-btn take-all', 'Take everything incoming');
      all.type = 'button';
      all.addEventListener('click', function () {
        diffs.forEach(function (d) { d.apply(); });
        markDirty(); renderAll(); $('#mergeDialog').close();
      });
      list.appendChild(all);
    }
    $('#mergeDialog').showModal();
  }

  /* ---------- init ---------- */
  function init() {
    $('#btnSave').addEventListener('click', saveJSON);
    $('#btnPrint').addEventListener('click', function () { window.print(); });
    $('#btnBump').addEventListener('click', openBump);
    $('#bumpGo').addEventListener('click', function (e) { e.preventDefault(); doBump(); });
    $('#bumpCancel').addEventListener('click', function (e) { e.preventDefault(); $('#bumpDialog').close(); });
    $('#mergeClose').addEventListener('click', function (e) { e.preventDefault(); $('#mergeDialog').close(); });

    $('#btnLoad').addEventListener('click', function () { $('#loadFile').click(); });
    $('#loadFile').addEventListener('change', function () {
      if (this.files[0]) readFile(this.files[0], loadJSON);
      this.value = '';
    });
    $('#btnMerge').addEventListener('click', function () { $('#mergeFile').click(); });
    $('#mergeFile').addEventListener('change', function () {
      if (this.files[0]) readFile(this.files[0], openMerge);
      this.value = '';
    });

    $('#search').addEventListener('input', function () { query = this.value; applyFilter(); });

    document.querySelectorAll('.side-tab').forEach(function (b) {
      b.addEventListener('click', function () {
        sideTab = b.dataset.tab;
        document.querySelectorAll('.side-tab').forEach(function (x) { x.classList.toggle('on', x === b); });
        $('#toc').hidden = sideTab !== 'toc';
        $('#gaps').hidden = sideTab !== 'gaps';
      });
    });

    window.addEventListener('beforeunload', function (e) {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    renderAll();
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
